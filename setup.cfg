# Tool configuration for the Code Quality CI job.

[flake8]
max-line-length = 100
# E203 and W503 conflict with black's formatting.
extend-ignore = E203, W503

[isort]
# Match black so the two formatters agree.
profile = black
line_length = 88
known_first_party = src,core,cache,db,tools,monitoring,security,benchmarking,arcade
