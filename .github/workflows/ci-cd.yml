# FACT System CI/CD Pipeline
name: FACT CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # Security and Quality Checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-security.txt
          pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run Bandit security scan
        run: |
          # Full JSON report for the artifact; the second run is the gate.
          bandit -r src/ -f json -o security-report.json --exit-zero
          bandit -r src/ --severity-level medium

      # `safety check` is deprecated and now needs a Safety account login;
      # pip-audit uses the PyPA advisory database with no credentials.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip-audit -r requirements.txt -r requirements-test.txt -r requirements-security.txt \
            --format json --output safety-report.json

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            security-report.json
            safety-report.json

  # Code Quality and Linting
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Black formatting check
        run: black --check --diff src/ tests/

      - name: Run flake8 linting
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run mypy type checking
        run: mypy src/ --ignore-missing-imports

      - name: Run isort import sorting check
        run: isort --check-only --diff src/ tests/

  # Unit and Integration Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fact_test
          POSTGRES_USER: fact_test
          POSTGRES_PASSWORD: fact_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Set up test environment
        run: |
          cp .env.example .env
          echo "POSTGRES_URL=postgresql://fact_test:fact_test_password@localhost:5432/fact_test" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v \
            --junitxml=integration-test-results.xml

      # Owner action: add the CODECOV_TOKEN repository secret to enable uploads.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            integration-test-results.xml
            htmlcov/

  # Performance Tests
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run performance benchmarks
        run: |
          python -m pytest tests/performance/ -v \
            --benchmark-only \
            --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  # Build Docker Image. Images are pushed to GHCR only for published releases;
  # pushes and PRs build and scan the image locally without publishing it.
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Select primary image reference
        id: image
        run: echo "ref=${{ fromJSON(steps.meta.outputs.json).tags[0] }}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: production
          load: true
          push: false
          tags: fact:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fact:ci
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        if: github.event_name == 'release'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

  # Deploy to Staging. Owner actions: add the KUBE_CONFIG_STAGING secret and commit
  # deployment/kubernetes/{deployment,service,ingress}.yaml (not in the repo yet).
  # Without the secret the job skips its deploy steps.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.fact-system.com
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}

    steps:
      - name: Checkout code
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: actions/checkout@v4

      - name: Report skipped deploy
        if: ${{ env.KUBE_CONFIG == '' }}
        run: echo "::notice::KUBE_CONFIG_STAGING is not set; skipping staging deploy."

      - name: Configure kubectl
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to staging
        if: ${{ env.KUBE_CONFIG != '' }}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-tag }}
        run: |
          # Update image tag in deployment
          sed -i "s|image: .*|image: ${IMAGE_REF}|g" deployment/kubernetes/deployment.yaml

          # Apply Kubernetes manifests
          kubectl apply -f deployment/kubernetes/namespace.yaml
          kubectl apply -f deployment/kubernetes/secrets.yaml
          kubectl apply -f deployment/kubernetes/configmap.yaml
          kubectl apply -f deployment/kubernetes/deployment.yaml
          kubectl apply -f deployment/kubernetes/service.yaml
          kubectl apply -f deployment/kubernetes/ingress.yaml

          # Wait for deployment to complete
          kubectl rollout status deployment/fact-app -n fact-system --timeout=600s

      - name: Run smoke tests
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          # Wait for service to be ready
          sleep 30

          # Run basic health checks
          kubectl exec -n fact-system deployment/fact-app -- curl -f http://localhost:8000/health

          # Run smoke tests
          python scripts/smoke_tests.py --environment staging

  # Deploy to Production on published releases. Owner actions: add the
  # KUBE_CONFIG_PRODUCTION and SLACK_WEBHOOK_URL secrets and commit
  # deployment/kubernetes/deployment.yaml.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://fact-system.com
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: actions/checkout@v4

      - name: Report skipped deploy
        if: ${{ env.KUBE_CONFIG == '' }}
        run: echo "::notice::KUBE_CONFIG_PRODUCTION is not set; skipping production deploy."

      - name: Configure kubectl
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to production
        if: ${{ env.KUBE_CONFIG != '' }}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-tag }}
        run: |
          # Update image tag in deployment
          sed -i "s|image: .*|image: ${IMAGE_REF}|g" deployment/kubernetes/deployment.yaml

          # Apply Kubernetes manifests with rolling update
          kubectl apply -f deployment/kubernetes/namespace.yaml
          kubectl apply -f deployment/kubernetes/secrets.yaml
          kubectl apply -f deployment/kubernetes/configmap.yaml
          kubectl apply -f deployment/kubernetes/deployment.yaml

          # Wait for deployment to complete
          kubectl rollout status deployment/fact-app -n fact-system --timeout=900s

      - name: Run production validation
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          # Wait for service to be ready
          sleep 60

          # Run comprehensive validation
          python scripts/production_validation.py

      - name: Send deployment notification
        if: ${{ env.KUBE_CONFIG != '' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"FACT System deployed to production - Version: ${RELEASE_NAME}\"}"
